<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d20" />
      <stop offset="100%" stop-color="#0f0f11" />
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    
    <!-- Monogram Gradient (Silver/Gold metallic) -->
    <linearGradient id="mono-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e3e3e6" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    :root {
      --bg: url(#bg-grad);
      --border: url(#border-grad);
      --fg: url(#mono-grad);
      --glow-opacity: 0.15;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --fg: #151517;
        --glow-opacity: 0.05;
      }
    }
    .card-bg {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .monogram-glow {
      stroke: var(--fg);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: var(--glow-opacity);
    }
    .monogram {
      stroke: var(--fg);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dot-glow {
      fill: var(--fg);
      opacity: var(--glow-opacity);
    }
    .dot {
      fill: var(--fg);
    }
  </style>

  <!-- Outer Rounded Square Container -->
  <rect x="10" y="10" width="180" height="180" rx="48" class="card-bg" />

  <!-- Monogram Glow (Behind) -->
  <g filter="url(#glow)">
    <circle cx="82" cy="50" r="7.5" class="dot-glow" />
    <path d="M 82 78 L 82 148 L 132 78" class="monogram-glow" />
  </g>

  <!-- Monogram Foreground (Sharp) -->
  <circle cx="82" cy="50" r="7.5" class="dot" />
  <path d="M 82 78 L 82 148 L 132 78" class="monogram" />
</svg>
